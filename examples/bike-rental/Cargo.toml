axum.workspace = true
rostfrei.workspace = true
rostfrei-core.workspace = true
rostfrei-fixtures.workspace = true
rostfrei-tracer = { workspace = true, features = ["http"] }
rostfrei-messaging-core.workspace = true
rostfrei-nats.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio.workspace = true
tracing.workspace = true

[dev-dependencies]
http-body-util = "0.1"
rostfrei-testing = { path = "../../crates/rostfrei-testing" }
tower = { version = "0.5", features = ["util"] }
uuid.workspace = true

[lints]
workspace = true

[package.metadata.rostfrei.structure]
version = 1
domain-root = "src/domain"
