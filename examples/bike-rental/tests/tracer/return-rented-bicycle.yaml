schemaVersion: 1
id: return-rented-bicycle
name: Return a rented bicycle
given:
  fixture: rented-fleet
when:
  command:
    name: return-bicycle
    schemaVersion: 1
    aggregate:
      type: bike-rental/rental-fleet
      id: city-fleet
    payload:
      bicycle_id: bike-42
then:
  outcome: accepted
  within: 35s
  trace:
    contains:
      - kind: domain-event
        name: bicycle-returned
        schemaVersion: 1
        payload:
          fleet_id: city-fleet
          bicycle_id: bike-42
