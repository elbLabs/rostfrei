schemaVersion: 1
id: reject-unavailable-bicycle
name: Reject a maintenance-required bicycle
given:
  fixture: demo-fleet
when:
  command:
    name: rent-bicycle
    schemaVersion: 1
    aggregate:
      type: bike-rental/rental-fleet
      id: city-fleet
    payload:
      bicycle_id: bike-99
then:
  outcome:
    rejected:
      code: BICYCLE_UNAVAILABLE
      payload:
        bicycle_id: bike-99
  within: 35s
