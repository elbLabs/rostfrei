port: 4222
http_port: 8222
max_payload: 2113536

jetstream {
  store_dir: "/data/jetstream"
  # Nominal reservation budget, not preallocated disk: retain up to 256 default
  # 60-GiB applications (four messaging streams + a split pair) plus 1 TiB for
  # thousands of bounded fixtures. Tests write small payloads; actual free disk
  # still bounds writes. Dedicated account/stream quota tests keep their limits.
  max_file_store: 17592186044416 # 16 TiB; independent of builder free-disk size
}
