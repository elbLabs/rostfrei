<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#100e0a" />
    <meta
      name="description"
      content="Rostfrei keeps Rust domain structure explicit, typed, and easy to review."
    />
    <script>
      // Restore paths redirected by public/404.html before the router starts.
      ;(function (location) {
        if (location.search.startsWith("?/")) {
          const restoredPath = location.search
            .slice(1)
            .split("&")
            .map(function (part) {
              return part.replace(/~and~/g, "&")
            })
            .join("?")

          window.history.replaceState(
            null,
            "",
            location.pathname.slice(0, -1) + restoredPath + location.hash
          )
        }
      })(window.location)
    </script>
    <title>Rostfrei · Typed domain structure for Rust</title>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
