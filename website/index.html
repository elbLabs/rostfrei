<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#100e0a" />
    <link rel="icon" type="image/svg+xml" href="%BASE_URL%favicon.svg" />
    <!-- page-metadata:start -->
    <!-- Titles, descriptions, and sharing metadata come from src/site.ts. -->
    <!-- page-metadata:end -->
    <script>
      // Restore paths redirected by public/404.html before the router starts.
      ;(function (location) {
        if (location.search.startsWith("?/")) {
          const restoredPath = location.search
            .slice(1)
            .split("&")
            .map(function (part) {
              return part.replace(/~and~/g, "&")
            })
            .join("?")

          window.history.replaceState(
            null,
            "",
            location.pathname.slice(0, -1) + restoredPath + location.hash
          )
        }
      })(window.location)
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
