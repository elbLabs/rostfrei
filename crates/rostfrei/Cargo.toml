[package]
name = "rostfrei"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Domain modeling, event sourcing, and typed messaging for Rust applications"
repository.workspace = true
homepage.workspace = true
documentation.workspace = true
readme.workspace = true

[package.metadata.docs.rs]
all-features = true

[features]
default = []
nats = ["dep:rostfrei-nats", "rostfrei-tracer?/nats-host"]
http = ["dep:rostfrei-http"]
tracer = ["dep:rostfrei-tracer", "rostfrei-tracer/http", "fixtures"]
fixtures = ["dep:rostfrei-fixtures"]
testing = ["dep:rostfrei-testing", "fixtures"]

[dependencies]
rostfrei-core.workspace = true
rostfrei-messaging-core.workspace = true
rostfrei-registry.workspace = true
rostfrei-runtime.workspace = true
rostfrei-fixtures = { workspace = true, optional = true }
rostfrei-http = { workspace = true, optional = true }
rostfrei-nats = { workspace = true, optional = true }
rostfrei-testing = { workspace = true, optional = true }
rostfrei-tracer = { workspace = true, optional = true }

[dev-dependencies]
async-trait.workspace = true
rostfrei-domain.workspace = true
rostfrei-domain-runtime.workspace = true
rostfrei-macros.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio.workspace = true
uuid.workspace = true
trybuild.workspace = true

[lints]
workspace = true
