[package]
name = "rostfrei-tracer"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Application-linked diagnostics, observation, and behavioral testing for Rostfrei"
repository.workspace = true
homepage.workspace = true
documentation.workspace = true
readme.workspace = true

[features]
default = []
http = ["dep:axum", "dep:futures-util", "dep:percent-encoding"]
nats-host = ["http", "dep:rostfrei-nats"]
insights = ["nats-host", "dep:async-nats", "dep:reqwest", "dep:uuid", "dep:ring"]

[dependencies]
async-trait.workspace = true
async-nats = { workspace = true, optional = true }
base64.workspace = true
axum = { workspace = true, optional = true }
futures-util = { workspace = true, optional = true }
percent-encoding = { workspace = true, optional = true }
rostfrei-core.workspace = true
rostfrei-domain.workspace = true
rostfrei-fixtures.workspace = true
rostfrei-messaging-core.workspace = true
rostfrei-nats = { workspace = true, optional = true }
rostfrei-registry.workspace = true
rostfrei-runtime.workspace = true
schemars.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio.workspace = true
reqwest = { version = "0.12.28", default-features = false, features = ["json", "rustls-tls"], optional = true }
ring = { version = "0.17.14", optional = true }
uuid = { workspace = true, optional = true }

[dev-dependencies]
axum.workspace = true
futures-util.workspace = true
http-body-util = "0.1"
tempfile = "3"
tower = { version = "0.5", features = ["util"] }

[lints]
workspace = true

[[example]]
name = "governed-insights"
required-features = ["insights"]
