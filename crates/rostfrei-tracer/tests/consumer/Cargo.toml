[package]
name = "tracer-host-consumer"
version = "0.1.0"
edition = "2024"

[workspace]

[dependencies]
rostfrei = { path = "../../../rostfrei" }
rostfrei-nats = { path = "../../../rostfrei-nats" }
rostfrei-tracer = { path = "../..", features = ["nats-host"] }
async-trait = "0.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "signal"] }
reqwest = { version = "0.12", default-features = false, features = ["json"] }
