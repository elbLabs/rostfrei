[workspace]
resolver = "3"
members = [
    "crates/rostfrei",
    "crates/rostfrei-http",
    "crates/rostfrei-tracer",
    "crates/rostfrei-core",
    "crates/rostfrei-domain",
    "crates/rostfrei-domain-macros",
    "crates/rostfrei-domain-runtime",
    "crates/rostfrei-fixtures",
    "crates/rostfrei-macros",
    "crates/rostfrei-messaging-core",
    "crates/rostfrei-nats",
    "crates/rostfrei-registry",
    "crates/rostfrei-structure",
    "crates/rostfrei-testing",
    "examples/bike-rental",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.98"
license = "EUPL-1.2"

[workspace.dependencies]
async-nats = { version = "=0.50.0", default-features = false, features = ["jetstream", "ring", "server_2_10", "server_2_11", "server_2_12", "server_2_14"] }
async-trait = "0.1"
axum = "0.8"
base64 = "0.22"
clap = { version = "4", features = ["derive"] }
futures-util = "0.3"
heck = "0.5"
proc-macro2 = "1"
quote = "1"
schemars = "1.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
syn = { version = "2", features = ["full"] }
thiserror = "2"
tempfile = "3"
tokio = { version = "1", features = ["macros", "net", "rt-multi-thread", "sync", "time"] }
tracing = "0.1"
trybuild = "1"
uuid = { version = "1", features = ["v5", "v7"] }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }
nursery = { level = "deny", priority = -1 }

unwrap_used = "deny"
expect_used = "deny"
indexing_slicing = "deny"
missing_const_for_fn = "deny"
panic = "deny"
panic_in_result_fn = "deny"
unreachable = "deny"
uninhabited_references = "deny"
use_self = "deny"
derive_partial_eq_without_eq = "deny"
tuple_array_conversions = "deny"
future_not_send = "deny"
option_if_let_else = "deny"
redundant_pub_crate = "deny"
manual_assert = "deny"

significant_drop_in_scrutinee = "deny"
significant_drop_tightening = "deny"
string_slice = "deny"
unchecked_time_subtraction = "deny"
unimplemented = "deny"
todo = "deny"
exit = "deny"


arithmetic_side_effects = "deny"
as_conversions = "deny"

module_name_repetitions = "allow"
must_use_candidate = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
