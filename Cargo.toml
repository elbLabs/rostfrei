[workspace]
resolver = "3"
members = [
    "crates/rostfrei",
    "crates/rostfrei-core",
    "crates/rostfrei-domain",
    "crates/rostfrei-domain-macros",
    "crates/rostfrei-domain-runtime",
    "crates/rostfrei-macros",
    "crates/rostfrei-messaging-core",
    "crates/rostfrei-nats",
    "crates/rostfrei-registry",
    "crates/rostfrei-testing",
    "examples/bike-rental",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.93"
license = "EUPL-1.2"

[workspace.dependencies]
async-nats = { version = "=0.50.0", default-features = false, features = ["jetstream", "ring", "server_2_10", "server_2_11", "server_2_12", "server_2_14"] }
async-trait = "0.1"
base64 = "0.22"
futures-util = "0.3"
proc-macro-crate = "3"
proc-macro2 = "1"
quote = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
syn = { version = "2", features = ["full"] }
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync", "time"] }
tracing = "0.1"
trybuild = "1"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }
module_name_repetitions = "allow"
must_use_candidate = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
