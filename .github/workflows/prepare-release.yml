name: Prepare GitHub release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag (for example, v0.1.0)
        required: true
        type: string
      prerelease:
        description: Mark the release as a prerelease
        required: false
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  group: prepare-release-${{ inputs.tag }}
  cancel-in-progress: false

jobs:
  prepare-release:
    name: Create draft release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
          SELECTED_REF: ${{ github.ref }}
        run: |
          set -euo pipefail

          if [[ "$SELECTED_REF" != "refs/heads/main" ]]; then
            echo "::error::Run this workflow from the main branch."
            exit 1
          fi

          python3 scripts/versions.py check --tag "$RELEASE_TAG"

          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "::error::A GitHub release for $RELEASE_TAG already exists."
            exit 1
          fi

      - name: Qualify the installable Agent Skills kit
        run: python3 scripts/check_agent_skills.py
      - name: Build release-matched Agent Skills archive and checksum
        run: python3 scripts/package_agent_skills.py --output "$RUNNER_TEMP/agent-skills"

      - name: Create draft GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
          PRERELEASE: ${{ inputs.prerelease }}
        run: |
          set -euo pipefail

          options=(
            --repo "$GITHUB_REPOSITORY"
            --target "$GITHUB_SHA"
            --title "Rostfrei $RELEASE_TAG"
            --generate-notes
            --draft
          )

          if [[ "$PRERELEASE" == "true" ]]; then
            options+=(--prerelease)
          fi

          gh release create "$RELEASE_TAG" "${options[@]}" \
            "$RUNNER_TEMP/agent-skills/rostfrei-agent-skills-${RELEASE_TAG#v}.tar.gz" \
            "$RUNNER_TEMP/agent-skills/rostfrei-agent-skills-${RELEASE_TAG#v}.tar.gz.sha256"
