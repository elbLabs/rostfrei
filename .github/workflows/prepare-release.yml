name: Prepare GitHub release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag (for example, v0.1.0)
        required: true
        type: string
      prerelease:
        description: Mark the release as a prerelease
        required: false
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  group: prepare-release-${{ inputs.tag }}
  cancel-in-progress: false

jobs:
  prepare-release:
    name: Create draft release
    runs-on: ubuntu-latest
    steps:
      - name: Validate release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
          SELECTED_REF: ${{ github.ref }}
        run: |
          set -euo pipefail

          if [[ "$SELECTED_REF" != "refs/heads/main" ]]; then
            echo "::error::Run this workflow from the main branch."
            exit 1
          fi

          if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::The tag must be a semantic version such as v0.1.0 or v0.1.0-rc.1."
            exit 1
          fi

          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "::error::A GitHub release for $RELEASE_TAG already exists."
            exit 1
          fi

      - name: Create draft GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
          PRERELEASE: ${{ inputs.prerelease }}
        run: |
          set -euo pipefail

          options=(
            --repo "$GITHUB_REPOSITORY"
            --target "$GITHUB_SHA"
            --title "Rostfrei $RELEASE_TAG"
            --generate-notes
            --draft
          )

          if [[ "$PRERELEASE" == "true" ]]; then
            options+=(--prerelease)
          fi

          gh release create "$RELEASE_TAG" "${options[@]}"
