name: Check crate versions

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check-versions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python3 scripts/versions.py check
      - run: python3 -m unittest discover -s scripts -p 'test_*.py'
