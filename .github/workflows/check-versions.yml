name: Check crate versions

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check-versions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: rustup show active-toolchain
      - uses: Swatinem/rust-cache@v2
      - run: cargo xtask versions check
      # Source/CLI tests run in the Rust and Agent Skills jobs, where their native
      # build prerequisites are installed. This job owns version-tool regressions.
      - run: cargo test --locked -p xtask --test versions
