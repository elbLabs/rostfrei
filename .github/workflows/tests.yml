name: Tests

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  scaffold:
    name: External generated project
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CARGO_PROFILE_DEV_DEBUG: 0
      CARGO_PROFILE_TEST_DEBUG: 0
      CARGO_INCREMENTAL: 0
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install the repository Rust toolchain
        run: rustup show active-toolchain
      - uses: Swatinem/rust-cache@v2
        with:
          key: external-starter
      - name: Check and test the unmodified external starter
        run: python3 scripts/check_new_project.py

  rust:
    name: Rust and real NATS
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install the repository Rust toolchain
        run: rustup show active-toolchain
      - uses: Swatinem/rust-cache@v2
      - name: Check formatting
        run: cargo fmt --all --check
      - name: Check workspace lints
        run: cargo clippy --locked --workspace --all-targets --all-features -- -D warnings
      - name: Check domain structure
        run: cargo rostfrei-dev check --workspace
      - name: Verify CLI package includes scaffolding templates
        run: cargo package --locked --offline -p rostfrei-structure
      - name: Check the test runner
        run: python3 -m unittest discover -s scripts -p 'test_*.py'
      - name: Install the pinned native NATS authentication fixture
        run: |
          archive="$RUNNER_TEMP/nats-server.tar.gz"
          curl --fail --location --retry 3 --output "$archive" \
            https://github.com/nats-io/nats-server/releases/download/v2.12.15/nats-server-v2.12.15-linux-amd64.tar.gz
          printf '%s  %s\n' 58ab8131f819263897e2fc38e503e1b755b63bcafeecc7d12582487df48ca15e "$archive" | sha256sum --check
          tar -xzf "$archive" -C "$RUNNER_TEMP"
          echo "ROSTFREI_NATS_SERVER=$RUNNER_TEMP/nats-server-v2.12.15-linux-amd64/nats-server" >> "$GITHUB_ENV"
      - name: Test the workspace with an authenticated disposable broker and native restart fixtures
        run: python3 scripts/test_nats.py --contracts
      - name: Qualify the standalone automatic Tracer host with a disposable broker
        run: python3 scripts/test_nats.py -- python3 scripts/check_tracer_host.py
      - name: Test native authentication and TLS lifecycle
        run: cargo test --locked -p rostfrei-nats --test connection_integration -- --include-ignored --test-threads=1
      - name: Test clustered history replay recovery
        run: cargo test --locked -p rostfrei-nats --test event_store_integration history_cluster -- --ignored --test-threads=1

  studio:
    name: Studio browser tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: studio
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v4
        with:
          version: 10.10.0
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
        working-directory: .
      - name: Check shared UI
        working-directory: .
        run: |
          pnpm --filter @rostfrei/ui lint
          pnpm --filter @rostfrei/ui typecheck
      - uses: Swatinem/rust-cache@v2
        with:
          key: studio-live-host
      - run: pnpm lint
      - run: pnpm build
      - name: Test interactions without a live API fallback
        env:
          VITE_TRACER_API_URL: https://untrusted.invalid
          VITE_TRACER_TOKEN: ci-fixture-token
        run: pnpm test:ui
      - name: Run the application-linked host suite through real HTTP and Studio
        run: python3 ../scripts/test_nats.py -- python3 scripts/check_bike_rental_host.py --studio
      - name: Inspect desktop and mobile layouts
        run: |
          pnpm inspect:ui --scene all --theme light
          pnpm inspect:ui --scene all --theme dark --out artifacts/inspect-dark
          pnpm inspect:ui --scene rejected --viewport 390x844 --theme light
          pnpm inspect:ui --scene long-payload --viewport 390x844 --theme light
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: studio-inspection
          path: |
            studio/artifacts/inspect/
            studio/artifacts/inspect-dark/
          if-no-files-found: ignore

  website:
    name: Website and shared components
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v4
        with:
          version: 10.10.0
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm --dir website lint
      - name: Build with deployment base path
        env:
          VITE_BASE_PATH: /rostfrei/
        run: pnpm --dir website build
      - name: Check website and component gallery in Chrome
        env:
          VITE_BASE_PATH: /rostfrei/
        run: pnpm test:website
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: website-inspection
          path: artifacts/website/
          if-no-files-found: ignore
